<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陈国消息 · 多人聊天室</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC',system-ui,sans-serif;background:#0a0a1a;color:#fff;height:100vh;overflow:hidden}

/* 星空背景 */
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* 通用卡片 */
.card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.05);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:28px;padding:40px 36px;width:400px;max-width:92vw;z-index:10;box-shadow:0 32px 80px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.06)}
.card h2{text-align:center;font-weight:600;font-size:22px;margin-bottom:6px;letter-spacing:1px}
.card .sub{text-align:center;font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:24px}

/* Logo 四字方块 */
.logo-wrap{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.logo-block{width:52px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 16px rgba(120,60,220,0.35),inset 0 1px 0 rgba(255,255,255,0.15)}
.logo-block::after{content:'';position:absolute;top:0;left:0;right:0;height:38%;background:linear-gradient(to bottom,rgba(255,255,255,0.30),transparent);border-radius:14px 14px 0 0}
.lb1{background:linear-gradient(145deg,#7c3aed,#6d28d9)}
.lb2{background:linear-gradient(145deg,#8b5cf6,#7c3aed)}
.lb3{background:linear-gradient(145deg,#ec4899,#db2777)}
.lb4{background:linear-gradient(145deg,#f472b6,#ec4899)}

/* 输入 */
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:5px;letter-spacing:0.5px}
.input-group input{width:100%;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);color:#fff;font-size:15px;outline:none;transition:.25s}
.input-group input:focus{border-color:rgba(139,92,246,0.6);box-shadow:0 0 0 3px rgba(139,92,246,0.15)}
.btn-primary{width:100%;padding:13px;border:none;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.3s;letter-spacing:1px}
.btn-primary:hover{transform:scale(1.02);box-shadow:0 8px 28px rgba(124,58,237,0.35)}
.error{color:#f87171;font-size:13px;text-align:center;margin-top:10px;min-height:20px}

/* 聊天主界面 */
#chat{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;flex-direction:column}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(10,10,26,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06);z-index:20}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{display:flex;gap:4px}
.header-logo .mini-block{width:26px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden;position:relative}
.header-logo .mini-block::after{content:'';position:absolute;top:0;left:0;right:0;height:34%;background:linear-gradient(to bottom,rgba(255,255,255,0.28),transparent);border-radius:6px 6px 0 0}
.room-tag{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(124,58,237,0.25),rgba(236,72,153,0.25));border:1px solid rgba(139,92,246,0.25);border-radius:30px;padding:5px 14px;font-size:12px;color:rgba(255,255,255,0.75)}
.room-dot{width:7px;height:7px;border-radius:50%;background:#34d399;animation:pulse 2s infinite}
.online-count{font-size:13px;color:rgba(255,255,255,0.45);white-space:nowrap}
.btn-exit{padding:6px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);font-size:12px;cursor:pointer;transition:.25s}
.btn-exit:hover{background:rgba(248,113,113,0.15);border-color:rgba(248,113,113,0.3);color:#f87171}

/* 主体 */
.chat-body{display:flex;flex:1;overflow:hidden}
.messages-area{flex:1;display:flex;flex-direction:column;padding:16px 20px 0;overflow:hidden}
.msg-list{flex:1;overflow-y:auto;padding-right:8px;scroll-behavior:smooth}
.msg-list::-webkit-scrollbar{width:4px}
.msg-list::-webkit-scrollbar-track{background:transparent}
.msg-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:4px}

/* 消息气泡 */
.msg-row{display:flex;margin-bottom:14px;animation:fadeIn .3s ease}
.msg-self{justify-content:flex-end}
.msg-other{justify-content:flex-start}
.msg-bubble{max-width:68%;padding:11px 17px;border-radius:18px;word-break:break-word;line-height:1.5;font-size:14px;position:relative}
.msg-self .msg-bubble{background:linear-gradient(135deg,#7c3aed,#a855f7);border-bottom-right-radius:4px;color:#fff}
.msg-other .msg-bubble{background:rgba(255,255,255,0.09);border-bottom-left-radius:4px;color:rgba(255,255,255,0.88)}
.msg-name{font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.msg-other .msg-name{color:rgba(167,139,250,0.65)}
.avatar-dot{display:inline-block;width:14px;height:14px;border-radius:50%;font-size:7px;line-height:14px;text-align:center;color:#fff;font-weight:600;flex-shrink:0}
.msg-time{font-size:10px;color:rgba(255,255,255,0.25);margin-top:4px;text-align:right}
.system-msg{text-align:center;font-size:12px;color:rgba(255,255,255,0.27);margin:12px 0;padding:6px 12px;background:rgba(255,255,255,0.03);border-radius:20px;display:inline-block;width:auto;align-self:center}

/* 输入区 */
.msg-input-bar{display:flex;gap:10px;padding:14px 0 18px;border-top:1px solid rgba(255,255,255,0.05)}
.msg-input-bar input{flex:1;padding:12px 16px;border-radius:30px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none;transition:.25s}
.msg-input-bar input:focus{border-color:rgba(139,92,246,0.4)}
.msg-input-bar button{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-size:18px;cursor:pointer;transition:.3s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.msg-input-bar button:hover{transform:scale(1.06);box-shadow:0 4px 16px rgba(124,58,237,0.35)}

/* 在线侧栏 */
.sidebar{width:200px;flex-shrink:0;padding:16px 14px;border-left:1px solid rgba(255,255,255,0.05);overflow-y:auto;display:none}
.sidebar.show{display:block}
.sidebar-title{font-size:12px;color:rgba(255,255,255,0.33);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.user-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:12px;margin-bottom:4px;background:rgba(255,255,255,0.03);font-size:13px;color:rgba(255,255,255,0.78)}
.user-item .u-dot{width:8px;height:8px;border-radius:50%;background:#34d399;flex-shrink:0}
.user-item .u-avatar{width:22px;height:22px;border-radius:50%;font-size:9px;line-height:22px;text-align:center;color:#fff;font-weight:600;flex-shrink:0}
.user-item .u-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-item.me{background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.15)}
.user-item.me .u-name::after{content:' (你)';color:rgba(168,85,247,0.5);font-size:11px}

/* 状态指示器 */
.status-bar{position:fixed;bottom:14px;right:20px;display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.23);z-index:30;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);padding:5px 12px;border-radius:30px;border:1px solid rgba(255,255,255,0.04)}
.status-dot{width:7px;height:7px;border-radius:50%;transition:.5s}
.status-dot.green{background:#34d399;box-shadow:0 0 8px rgba(52,211,153,0.3)}
.status-dot.red{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,0.3)}
.status-dot.yellow{background:#eab308;box-shadow:0 0 8px rgba(234,179,8,0.2)}

/* 动画 */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* 响应式 */
@media(max-width:640px){
  .card{padding:28px 20px}
  .sidebar{width:140px;padding:12px 8px}
  .sidebar.show{display:none}
  .mobile-sidebar-toggle{display:flex!important}
  .chat-header{padding:10px 14px}
  .messages-area{padding:12px 12px 0}
  .header-logo .mini-block{width:20px;height:22px;font-size:10px}
  .room-tag{font-size:10px;padding:3px 10px}
  .online-count{font-size:11px}
}
.mobile-sidebar-toggle{display:none;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:rgba(255,255,255,0.5);padding:4px 10px;font-size:13px;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- 星空 -->
<canvas id="stars"></canvas>

<!-- 密码界面 -->
<div class="card" id="pwdCard">
  <div class="logo-wrap">
    <div class="logo-block lb1">陈</div>
    <div class="logo-block lb2">国</div>
    <div class="logo-block lb3">消</div>
    <div class="logo-block lb4">息</div>
  </div>
  <h2 style="font-size:20px;font-weight:500;color:rgba(255,255,255,0.7)">请输入密码</h2>
  <div class="input-group" style="margin-top:20px">
    <input type="password" id="pwdInput" placeholder="密码" autocomplete="off" onkeydown="if(event.key==='Enter')checkPwd()">
  </div>
  <button class="btn-primary" onclick="checkPwd()">进入</button>
  <div class="error" id="pwdError"></div>
</div>

<!-- 昵称界面 -->
<div class="card hidden" id="nameCard">
  <div class="logo-wrap" style="margin-bottom:12px">
    <div class="logo-block lb1" style="width:42px;height:48px;font-size:20px">陈</div>
    <div class="logo-block lb2" style="width:42px;height:48px;font-size:20px">国</div>
    <div class="logo-block lb3" style="width:42px;height:48px;font-size:20px">消</div>
    <div class="logo-block lb4" style="width:42px;height:48px;font-size:20px">息</div>
  </div>
  <h2 style="font-size:18px;font-weight:500;color:rgba(255,255,255,0.7)">设置你的昵称</h2>
  <div class="input-group" style="margin-top:16px">
    <input type="text" id="nameInput" placeholder="输入昵称..." maxlength="20" autocomplete="off" onkeydown="if(event.key==='Enter')setName()">
  </div>
  <button class="btn-primary" onclick="setName()">加入聊天</button>
  <div class="error" id="nameError"></div>
</div>

<!-- 聊天主界面 -->
<div id="chat">
  <div class="chat-header">
    <div class="header-left">
      <div class="header-logo">
        <div class="mini-block lb1">陈</div>
        <div class="mini-block lb2">国</div>
        <div class="mini-block lb3">消</div>
        <div class="mini-block lb4">息</div>
      </div>
      <div class="room-tag"><span class="room-dot"></span>官方聊天室</div>
      <span class="online-count" id="onlineCount">0 人在线</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="mobile-sidebar-toggle" id="mobileSidebarBtn" onclick="toggleMobileSidebar()">👥</button>
      <button class="btn-exit" onclick="exitChat()">退出</button>
    </div>
  </div>
  <div class="chat-body">
    <div class="messages-area">
      <div class="msg-list" id="msgList"></div>
      <div class="msg-input-bar">
        <input type="text" id="msgInput" placeholder="输入消息..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMsg()">
        <button onclick="sendMsg()">➤</button>
      </div>
    </div>
    <div class="sidebar show" id="sidebar">
      <div class="sidebar-title">在线成员</div>
      <div id="userList"></div>
    </div>
  </div>
</div>

<!-- 状态指示器 -->
<div class="status-bar">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText">连接中...</span>
</div>

<script>
// ========== 配置 ==========
const CORRECT_PWD = 'leapadbackroom194341';
const ROOM = 'official';
const STORAGE_KEY = 'chenguo_chat_msgs';

// ========== 星空背景 ==========
(function initStars(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');
  let w,h,stars=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;stars=Array.from({length:180},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+0.3,a:Math.random()}))}
  resize();window.addEventListener('resize',resize);
  function draw(){ctx.clearRect(0,0,w,h);stars.forEach(s=>{s.a+=0.005;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${0.3+0.3*Math.sin(s.a)})`;ctx.fill()});requestAnimationFrame(draw)}
  draw();
})();

// ========== 状态 ==========
let myId = null;
let myNick = '';
let peer = null;
let connections = {}; // {peerId: DataConnection}
let onlineUsers = {}; // {peerId: {nick, color, lastSeen}}
let isLeaving = false;
const HEARTBEAT_INTERVAL = 3500;
const OFFLINE_TIMEOUT = 9000;

// ========== 工具函数 ==========
function genColor(str){
  let hash=0;for(let i=0;i<str.length;i++){hash=str.charCodeAt(i)+((hash<<5)-hash)}
  const hue=hash%360;return `hsl(${hue},70%,55%)`;
}
function getTime(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
function $(id){return document.getElementById(id)}

// ========== 界面切换 ==========
function checkPwd(){
  const v=$('pwdInput').value.trim();
  if(v===CORRECT_PWD){$('pwdCard').classList.add('hidden');$('nameCard').classList.remove('hidden');$('pwdError').textContent=''}
  else{$('pwdError').textContent='密码错误，请重试';$('pwdInput').value='';$('pwdInput').focus()}
}
function setName(){
  const v=$('nameInput').value.trim();
  if(!v||v.length>20){$('nameError').textContent='请输入有效昵称（1-20字符）';return}
  $('nameError').textContent='';
  myNick=v;
  startChat();
}

// ========== 启动聊天 ==========
function startChat(){
  $('nameCard').classList.add('hidden');
  $('chat').style.display='flex';
  loadHistory();
  connectPeer();
}

// ========== PeerJS 连接 ==========
function connectPeer(){
  setStatus('yellow','连接中...');
  myId = 'chenguo_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  peer = new Peer(myId, {
    debug: 0,
    config: {'iceServers': [
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:stun1.l.google.com:19302'},
      {urls:'turn:relay.backups.cz?transport=tcp',username:'webrtc',credential:'webrtc'}
    ]}
  });

  peer.on('open', (id) => {
    console.log('Peer open:', id);
    myId = id;
    setStatus('green','已连接');
    // 尝试连接已知节点
    connectToKnownPeers();
    // 开始广播心跳
    startHeartbeat();
    // 监听新连接
    peer.on('connection', handleConnection);
    // 监听 storage 变化（同设备多标签页同步）
    window.addEventListener('storage', handleStorageEvent);
    // 加入通知
    broadcast({type:'join', nick:myNick, color:genColor(myNick), room:ROOM});
  });

  peer.on('error', (err) => {
    console.warn('Peer error:', err.type);
    if(err.type === 'unavailable-id'){
      // ID冲突，重新生成
      myId = 'chenguo_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      peer.reconnect();
    } else {
      setStatus('red','连接异常');
    }
  });

  peer.on('disconnected', () => {
    setStatus('yellow','重连中...');
    setTimeout(() => {
      if(peer && !peer.destroyed) peer.reconnect();
      else connectPeer();
    }, 3000);
  });
}

// ========== 连接处理 ==========
function handleConnection(conn){
  const pid = conn.peer;
  conn.on('open', () => {
    console.log('Connected to:', pid);
    connections[pid] = conn;
    // 发送自己的信息
    conn.send({type:'info', nick:myNick, color:genColor(myNick), room:ROOM});
    // 监听消息
    conn.on('data', (data) => handleData(data, pid));
    conn.on('close', () => {
      delete connections[pid];
      removeUser(pid);
    });
  });
}

function connectToKnownPeers(){
  // 从 localStorage 读取已知节点
  try{
    const known = JSON.parse(localStorage.getItem('chenguo_peers') || '[]');
    known.forEach(pid => {
      if(pid !== myId && !connections[pid]){
        const conn = peer.connect(pid, {reliable:true});
        handleConnection(conn);
      }
    });
  }catch(e){}
}

// ========== 数据处理 ==========
function handleData(data, fromPeerId){
  if(!data || data.room !== ROOM) return;
  switch(data.type){
    case 'info':
      onlineUsers[fromPeerId] = {nick:data.nick, color:data.color, lastSeen:Date.now()};
      updateUI();
      // 回复自己的信息
      if(connections[fromPeerId]){
        connections[fromPeerId].send({type:'info', nick:myNick, color:genColor(myNick), room:ROOM});
      }
      break;
    case 'join':
      addSystemMsg(`${data.nick} 加入了聊天室`);
      onlineUsers[fromPeerId] = {nick:data.nick, color:data.color, lastSeen:Date.now()};
      updateUI();
      break;
    case 'leave':
      addSystemMsg(`${data.nick} 离开了聊天室`);
      removeUser(fromPeerId);
      break;
    case 'message':
      addMessage(data.nick, data.text, data.time, data.color, false);
      saveToLocal({type:'message', nick:data.nick, text:data.text, time:data.time, color:data.color});
      break;
    case 'heartbeat':
      if(onlineUsers[fromPeerId]) onlineUsers[fromPeerId].lastSeen = Date.now();
      break;
  }
}

// ========== 广播 ==========
function broadcast(data){
  data.room = ROOM;
  Object.values(connections).forEach(conn => {
    if(conn.open) conn.send(data);
  });
  // 同设备多标签页同步
  try{localStorage.setItem('chenguo_broadcast_' + Date.now(), JSON.stringify(data))}catch(e){}
}

// ========== 心跳 ==========
function startHeartbeat(){
  setInterval(() => {
    if(peer && peer.open){
      broadcast({type:'heartbeat', room:ROOM});
      // 检查超时用户
      const now = Date.now();
      Object.keys(onlineUsers).forEach(pid => {
        if(pid !== myId && now - (onlineUsers[pid].lastSeen||0) > OFFLINE_TIMEOUT){
          const nick = onlineUsers[pid].nick;
          removeUser(pid);
          addSystemMsg(`${nick} 已断开连接`);
        }
      });
      // 保存已知节点
      try{localStorage.setItem('chenguo_peers', JSON.stringify(Object.keys(connections).slice(0,20)))}catch(e){}
    }
  }, HEARTBEAT_INTERVAL);
}

// ========== 用户管理 ==========
function removeUser(pid){
  delete onlineUsers[pid];
  delete connections[pid];
  updateUI();
}

// ========== 发送消息 ==========
function sendMsg(){
  const input = $('msgInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const time = getTime();
  addMessage(myNick, text, time, genColor(myNick), true);
  saveToLocal({type:'message', nick:myNick, text, time, color:genColor(myNick)});
  broadcast({type:'message', nick:myNick, text, time, color:genColor(myNick), room:ROOM});
}

// ========== 渲染消息 ==========
function addMessage(nick, text, time, color, isSelf){
  const list = $('msgList');
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isSelf ? 'msg-self' : 'msg-other');
  const avatarHtml = `<span class="avatar-dot" style="background:${color}">${nick.charAt(0)}</span>`;
  row.innerHTML = `
    <div class="msg-bubble">
      ${!isSelf ? `<div class="msg-name">${avatarHtml} ${nick}</div>` : ''}
      <div>${escapeHtml(text)}</div>
      <div class="msg-time">${time}</div>
    </div>
  `;
  list.appendChild(row);
  list.scrollTop = list.scrollHeight;
}

function addSystemMsg(text){
  const list = $('msgList');
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;margin:10px 0';
  div.innerHTML = `<span style="font-size:12px;color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.04);padding:4px 14px;border-radius:20px;display:inline-block">${escapeHtml(text)}</span>`;
  list.appendChild(div);
  list.scrollTop = list.scrollHeight;
}

// ========== 本地存储 ==========
function saveToLocal(msg){
  try{
    const msgs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    msgs.push(msg);
    if(msgs.length > 200) msgs.splice(0, msgs.length - 200);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));
  }catch(e){}
}

function loadHistory(){
  try{
    const msgs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    $('msgList').innerHTML = '';
    msgs.forEach(m => {
      if(m.type === 'message') addMessage(m.nick, m.text, m.time, m.color, m.nick === myNick);
      else if(m.type === 'system') addSystemMsg(m.text);
    });
  }catch(e){}
}

// ========== Storage 事件（同设备多标签页） ==========
function handleStorageEvent(e){
  if(e.key && e.key.startsWith('chenguo_broadcast_')){
    try{
      const data = JSON.parse(e.newValue);
      if(data && data.room === ROOM && data.type === 'message' && data.nick !== myNick){
        addMessage(data.nick, data.text, data.time, data.color, false);
        saveToLocal(data);
      }
    }catch(e){}
  }
  if(e.key === STORAGE_KEY){
    loadHistory();
  }
}

// ========== UI 更新 ==========
function updateUI(){
  const count = Object.keys(onlineUsers).length + 1; // +1 自己
  $('onlineCount').textContent = `${count} 人在线`;
  
  const list = $('userList');
  list.innerHTML = '';
  // 自己
  const meDiv = document.createElement('div');
  meDiv.className = 'user-item me';
  meDiv.innerHTML = `<span class="u-avatar" style="background:${genColor(myNick)}">${myNick.charAt(0)}</span><span class="u-dot"></span><span class="u-name">${escapeHtml(myNick)}</span>`;
  list.appendChild(meDiv);
  // 其他人
  Object.keys(onlineUsers).forEach(pid => {
    const u = onlineUsers[pid];
    if(!u) return;
    const div = document.createElement('div');
    div.className = 'user-item';
    div.innerHTML = `<span class="u-avatar" style="background:${u.color}">${u.nick.charAt(0)}</span><span class="u-dot"></span><span class="u-name">${escapeHtml(u.nick)}</span>`;
    list.appendChild(div);
  });
}

function setStatus(color, text){
  const dot = $('statusDot');
  dot.className = 'status-dot ' + color;
  $('statusText').textContent = text;
}

function toggleMobileSidebar(){
  $('sidebar').classList.toggle('show');
}

function exitChat(){
  if(isLeaving) return;
  isLeaving = true;
  broadcast({type:'leave', nick:myNick, room:ROOM});
  if(peer) peer.destroy();
  Object.keys(connections).forEach(k => {try{connections[k].close()}catch(e){}});
  connections = {};
  onlineUsers = {};
  $('chat').style.display = 'none';
  $('pwdCard').classList.remove('hidden');
  $('pwdInput').value = '';
  $('pwdInput').focus();
  isLeaving = false;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ========== 页面关闭清理 ==========
window.addEventListener('beforeunload', () => {
  if(peer && peer.open){
    try{
      const payload = JSON.stringify({type:'leave', nick:myNick, room:ROOM});
      navigator.sendBeacon('/leave', payload);
    }catch(e){}
    broadcast({type:'leave', nick:myNick, room:ROOM});
  }
});
